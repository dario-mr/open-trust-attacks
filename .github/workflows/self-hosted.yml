# Attacks with a vendor-controlled (self-hosted) runner. Run only while that runner is attached, with
# the labels otrust-attack and ubuntu-24.04 (open-trust/demo/attacks/run.sh does this).
name: self-hosted

on:
  workflow_dispatch:

permissions: {}

jobs:
  # the vendor's own job, on the vendor's own machine
  own-self-hosted:
    # after hijack, so the vendor runner is idle while the assessor's job is queued
    needs: hijack
    runs-on: [self-hosted, otrust-attack]
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, assess and sign on the vendor's runner
        run: |
          set -euo pipefail
          case $(uname -m) in x86_64) a=amd64 s=d317f7d9ad521fb90a68d503c12305d3020dba75a3e24a0912fadb22697a8c4f ;;
            aarch64) a=arm64 s=25691c5472caabf42cabe84a3b1f8c09e9884701636680cb5751c60572d4bd64 ;; esac
          # the binary stays on the runner's own disk: a freshly chmod-ed file on a host-shared mount
          # (docker-outside-of-docker on colima) can still read as not executable
          bin=/tmp/otrust-$GITHUB_RUN_ID
          curl -fsSL -o "$bin" "https://github.com/dario-mr/open-trust/releases/download/v0.1.16/otrust-linux-$a"
          echo "$s  $bin" | sha256sum -c
          chmod +x "$bin"
          docker buildx inspect otrust-attack >/dev/null 2>&1 || docker buildx create --name otrust-attack --driver docker-container >/dev/null
          docker buildx build --builder otrust-attack --provenance=mode=min --sbom=false --output "type=oci,dest=$RUNNER_TEMP/image.oci.tar" .
          "$bin" assess --keyless --image "$RUNNER_TEMP/image.oci.tar" --name example.com/open-trust-attacks \
            --source . --out "$RUNNER_TEMP/otrust-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: otrust-own-self-hosted
          path: |
            ${{ runner.temp }}/otrust-out
            ${{ runner.temp }}/image.oci.tar

  # the isolated assessor asks for runs-on: ubuntu-24.04; can a vendor runner with that label take it?
  build:
    runs-on: [self-hosted, otrust-attack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker buildx inspect otrust-attack >/dev/null 2>&1 || docker buildx create --name otrust-attack --driver docker-container >/dev/null
          docker buildx build --builder otrust-attack --provenance=mode=min --sbom=false --output type=oci,dest=image.oci.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.oci.tar
          if-no-files-found: error
  hijack:
    needs: build
    permissions: { contents: read, id-token: write, packages: read }
    uses: dario-mr/open-trust/.github/workflows/assess.yml@09477585a21fdceacc434126c751fa018cad8c09 # v0.1.16
    with:
      image-artifact: image
      subject-name: example.com/open-trust-attacks
      artifact-suffix: hijack
      fail-on-failed-assessment: false # no provenance here; the certificate is what matters

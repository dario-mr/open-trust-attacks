# Attacks with a vendor-controlled (self-hosted) runner. Run only while that runner is attached, with
# the labels otrust-attack and ubuntu-24.04 (open-trust/demo/attacks/run.sh does this).
name: self-hosted

on:
  workflow_dispatch:

permissions: {}

jobs:
  # the vendor's own job, on the vendor's own machine
  own-self-hosted:
    runs-on: [self-hosted, otrust-attack]
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, assess and sign on the vendor's runner
        run: |
          set -euo pipefail
          case $(uname -m) in x86_64) a=amd64 s=2982f827f7c517e5c887a032e3240fde4e4f4c184667f8c4ad279a32f925ab34 ;;
            aarch64) a=arm64 s=d0956a709a5180574b27a4af42c94a98d8e08ea6b81f0a5d39f2c64e76ff87e3 ;; esac
          curl -fsSL -o "$RUNNER_TEMP/otrust" "https://github.com/dario-mr/open-trust/releases/download/v0.1.9/otrust-linux-$a"
          echo "$s  $RUNNER_TEMP/otrust" | sha256sum -c
          chmod +x "$RUNNER_TEMP/otrust"
          docker buildx inspect otrust-attack >/dev/null 2>&1 || docker buildx create --name otrust-attack --driver docker-container >/dev/null
          docker buildx build --builder otrust-attack --provenance=mode=min --sbom=false --output "type=oci,dest=$RUNNER_TEMP/image.oci.tar" .
          "$RUNNER_TEMP/otrust" assess --keyless --image "$RUNNER_TEMP/image.oci.tar" --name example.com/open-trust-attacks \
            --source . --out "$RUNNER_TEMP/otrust-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: otrust-own-self-hosted
          path: ${{ runner.temp }}/otrust-out

  # the isolated assessor asks for runs-on: ubuntu-24.04; can a vendor runner with that label take it?
  build:
    runs-on: [self-hosted, otrust-attack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker buildx inspect otrust-attack >/dev/null 2>&1 || docker buildx create --name otrust-attack --driver docker-container >/dev/null
          docker buildx build --builder otrust-attack --provenance=mode=min --sbom=false --output type=oci,dest=image.oci.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.oci.tar
          if-no-files-found: error
  hijack:
    needs: build
    permissions: { contents: read, id-token: write, packages: read }
    uses: dario-mr/open-trust/.github/workflows/assess.yml@5717e68a21ac99225eccff6850dd90e096ceda94 # v0.1.9
    with:
      image-artifact: image
      subject-name: example.com/open-trust-attacks
      artifact-suffix: hijack
      fail-on-failed-assessment: false # no provenance here; the certificate is what matters
